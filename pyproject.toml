[project]
name = "career-coach"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kellytea", email = "ktran49@asu.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "gliner>=0.2.30",
    "pandas==3.1.1",
    "pymupdf==2.1.0",
    "rdflib>=7.6.0",
]

[project.scripts]
career-coach = "career_coach.data_extraction.main:main"

[project.optional-dependencies]
ner = [
    "spacy>=3.8.18",
]

[tool.uv]
link-mode = "copy"

[tool.uv.build-backend]
module-name = "career_coach.data_extraction"
module-root = ""

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
